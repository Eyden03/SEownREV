</style></head><body><header class="hero"><div class="wrap"><h1>SE Reviewer</h1><p>Formative Assessments • Summative Assessments • Midterms · Instant answer checking</p></div></header><main class="wrap"><section class="panel" aria-label="Reviewer controls"><div class="toolbar"><div class="field"><label for="section">Choose questions</label><select id="section"><optgroup label="Formative Assessments"><option value="all-fa">All modules (FA)</option><option value="FA 1">Module 1</option><option value="FA 2">Module 2</option><option value="FA 3">Module 3</option><option value="FA 4">Module 4</option></optgroup><optgroup label="Summative Assessments"><option value="all-sa">All SA</option><option value="SA 1">SA 1</option><option value="SA 2">SA 2</option></optgroup><optgroup label="Exam"><option value="Midterms">Midterms</option></optgroup></select></div><button id="shuffle" type="button">Shuffle questions</button><button id="reset" type="button">Reset answers</button></div><div class="stats" aria-live="polite"><div class="stat"><strong id="total">0</strong><span>Questions</span></div><div class="stat"><strong id="answered">0</strong><span>Answered</span></div><div class="stat"><strong id="correct">0</strong><span>Correct</span></div><div class="stat"><strong id="score">0%</strong><span>Score</span></div></div></section><div id="questions" class="list"></div></main><script id="data" type="application/json">[{"group":"FA 1","number":1,"prompt":"Which best describes software?","options":["B. A collection of computer programs, procedures, and documentation that perform tasks on a computer system","A. Only the physical components of a computer","D. A network connection between computers","C. A device used to store information"],"answers":["B. A collection of computer programs, procedures, and documentation that perform tasks on a computer system"],"id":"fa1-1"},{"group":"FA 1","number":2,"prompt":"Which type of software is a collection of programs written to service other programs?","options":["B. Embedded Software","A. Application Software","D. Product-line Software","C. System Software"],"answers":["B. Embedded Software"],"id":"fa1-2"},{"group":"FA 1","number":3,"prompt":"Which software category usually consists of stand-alone programs that solve specific business needs?","options":["B. System Software","C. Engineering Software","A. Application Software","D. Embedded Software"],"answers":["A. Application Software"],"id":"fa1-3"},{"group":"FA 1","number":4,"prompt":"Which type of software resides within a product or system and implements control features?","options":["A. Web Application","C. Application Software","D. Product-line Software","B. Embedded Software"],"answers":["B. Embedded Software"],"id":"fa1-4"},{"group":"FA 1","number":5,"prompt":"What is a major characteristic of legacy software?","options":["B. It cannot be modified.","D. It is always inexpensive to maintain.","C. It consists of older programs developed decades ago.","A. It was developed only for mobile devices."],"answers":["C. It consists of older programs developed decades ago."],"id":"fa1-5"},{"group":"FA 1","number":6,"prompt":"Which is considered an “infant” software technology in the module?","options":["C. System Software","A. Legacy Software","B. WebApps","D. Engineering Software"],"answers":["B. WebApps"],"id":"fa1-6"},{"group":"FA 1","number":7,"prompt":"What does cloud computing enable users to do?","options":["C. Eliminate the need for computing devices","A. Use computing resources only from one location","B. Share or use computing resources on a broad scale from anywhere or anytime","D. Use only stand-alone applications"],"answers":["B. Share or use computing resources on a broad scale from anywhere or anytime"],"id":"fa1-7"},{"group":"FA 1","number":8,"prompt":"Software engineering is best described as:","options":["B. A process, collection of methods, and tools for building high-quality computer software","C. The process of purchasing computer programs","D. The study of computer networks only","A. The physical repair of computer hardware"],"answers":["B. A process, collection of methods, and tools for building high-quality computer software"],"id":"fa1-8"},{"group":"FA 1","number":9,"prompt":"Which two qualities are required in software engineering according to the module?","options":["A. Speed and complexity","B. Adaptability and agility","D. Hardware and networking","C. Cost and size"],"answers":["B. Adaptability and agility"],"id":"fa1-9"},{"group":"FA 1","number":10,"prompt":"What is the foundation of software engineering as a layered technology?","options":["D. Programming","C. Process","A. Tools","B. Methods"],"answers":["C. Process"],"id":"fa1-10"},{"group":"FA 2","number":1,"prompt":"What is software engineering?","options":["A. The physical assembly of computer components","C. The process of connecting computers to the internet","D. The installation of operating systems only","B. The systematic application of engineering principles to software development"],"answers":["B. The systematic application of engineering principles to software development"],"id":"fa2-1"},{"group":"FA 2","number":2,"prompt":"Which type of software is designed to solve a specific user or business need?","options":["B. System software","C. Embedded software","A. Application software","D. Firmware"],"answers":["A. Application software"],"id":"fa2-2"},{"group":"FA 2","number":3,"prompt":"Which information-system activity converts raw data into useful information?","options":["B. Processing","D. Feedback","C. Output","A. Input"],"answers":["B. Processing"],"id":"fa2-3"},{"group":"FA 2","number":4,"prompt":"Which information system processes routine transactions such as payroll and sales orders?","options":["D. Expert System","A. Decision Support System","B. Executive Information System","C. Transaction Processing System"],"answers":["C. Transaction Processing System"],"id":"fa2-4"},{"group":"FA 2","number":5,"prompt":"What is the main purpose of the Systems Development Life Cycle?","options":["B. To provide a structured process for developing and maintaining systems","D. To purchase computer hardware","C. To focus only on software coding","A. To eliminate the need for system documentation"],"answers":["B. To provide a structured process for developing and maintaining systems"],"id":"fa2-5"},{"group":"FA 2","number":6,"prompt":"During which SDLC phase are user needs and system requirements gathered and analyzed?","options":["D. System Maintenance","B. System Development","C. System Implementation","A. System Analysis"],"answers":["A. System Analysis"],"id":"fa2-6"},{"group":"FA 2","number":7,"prompt":"What is a project?","options":["B. An activity without a specific objective","A. A permanent collection of routine tasks","C. A temporary endeavor that produces a unique product or service","D. A process that has no beginning or ending"],"answers":["C. A temporary endeavor that produces a unique product or service"],"id":"fa2-7"},{"group":"FA 2","number":8,"prompt":"Which project-management tool uses horizontal bars to show tasks and their schedules?","options":["C. Data Flow Diagram","D. Decision tree","A. PERT chart","B. Gantt chart"],"answers":["B. Gantt chart"],"id":"fa2-8"},{"group":"FA 2","number":9,"prompt":"Which Agile value emphasizes adjusting to new requirements?","options":["B. Contract negotiation over customer collaboration","D. Documentation over working software","C. Responding to change over following a plan","A. Following a plan over responding to change"],"answers":["C. Responding to change over following a plan"],"id":"fa2-9"},{"group":"FA 2","number":10,"prompt":"Which diagram illustrates how data moves through a system?","options":["D. PERT chart","B. Organizational chart","C. Data Flow Diagram","A. Gantt chart"],"answers":["C. Data Flow Diagram"],"id":"fa2-10"},{"group":"FA 3","number":1,"prompt":"Which statement best describes Agile software development?","options":["A. Development follows a fixed sequence with no changes","B. Requirements and solutions evolve through collaboration","C. Documentation must be completed before development begins","D. Customers participate only after the product is completed"],"answers":["B. Requirements and solutions evolve through collaboration"],"id":"fa3-1"},{"group":"FA 3","number":2,"prompt":"Which of the following is one of the Agile Development Values?","options":["A. Processes and tools over individuals and interactions","B. Contract negotiation over customer collaboration","C. Working software over comprehensive documentation","D. Following a plan over responding to change"],"answers":["C. Working software over comprehensive documentation"],"id":"fa3-2"},{"group":"FA 3","number":3,"prompt":"According to Agile principles, what is the primary measure of progress?","options":["A. Completed documentation","B. Working software","C. Number of meetings","D. Project budget"],"answers":["B. Working software"],"id":"fa3-3"},{"group":"FA 3","number":4,"prompt":"Which characteristic distinguishes Agile from the Waterfall model?","options":["A. Agile follows only one development phase.","B. Agile discourages customer involvement.","C. Agile uses an incremental and iterative approach.","D. Agile requires all requirements to remain unchanged."],"answers":["C. Agile uses an incremental and iterative approach."],"id":"fa3-4"},{"group":"FA 3","number":5,"prompt":"Agile encourages teams to respond to changing requirements:","options":["A. Only before development starts","B. Only during planning","C. Even late in development","D. Never after requirements are approved"],"answers":["C. Even late in development"],"id":"fa3-5"},{"group":"FA 3","number":6,"prompt":"Which Agile methodology focuses primarily on people and their interactions rather than processes and tools?","options":["A. DSDM","B. Crystal Methodology","C. FDD","D. Waterfall"],"answers":["B. Crystal Methodology"],"id":"fa3-6"},{"group":"FA 3","number":7,"prompt":"Who developed the Crystal Methodology?","options":["A. Kent Beck","B. Alistair Cockburn","C. Ken Schwaber","D. Mary Poppendieck"],"answers":["B. Alistair Cockburn"],"id":"fa3-7"},{"group":"FA 3","number":8,"prompt":"Which sequence correctly represents the three phases of Crystal Methodology?","options":["A. Planning, Coding, Testing","B. Analysis, Design, Deployment","C. Chartering, Cyclic Delivery, Wrap Up","D. Feasibility, Development, Maintenance"],"answers":["C. Chartering, Cyclic Delivery, Wrap Up"],"id":"fa3-8"},{"group":"FA 3","number":9,"prompt":"Agile emphasizes individuals and interactions over processes and tools.","options":["True","False"],"answers":["True"],"id":"fa3-9"},{"group":"FA 3","number":10,"prompt":"Agile considers comprehensive documentation more important than working software.","options":["True","False"],"answers":["False"],"id":"fa3-10"},{"group":"FA 4","number":1,"prompt":"What is a model in systems development?","options":["A. A complete copy of an existing system","B. A simplified description of a system","C. A collection of programming codes","D. A list of hardware components"],"answers":["B. A simplified description of a system"],"id":"fa4-1"},{"group":"FA 4","number":2,"prompt":"What does systems modeling use to conceptualize and construct systems?","options":["A. Models and diagrams","B. Programming languages only","C. Financial statements","D. Marketing plans"],"answers":["A. Models and diagrams"],"id":"fa4-2"},{"group":"FA 4","number":3,"prompt":"Which modeling approach represents the functions, activities, and operations within a system?","options":["A. Enterprise modeling","B. Data modeling","C. Functional modeling","D. Financial modeling"],"answers":["C. Functional modeling"],"id":"fa4-3"},{"group":"FA 4","number":4,"prompt":"In functional modeling, which element illustrates the transformation of input into output?","options":["A. Process","B. Data store","C. External entity","D. Flow line"],"answers":["A. Process"],"id":"fa4-4"},{"group":"FA 4","number":5,"prompt":"What does a Functional Flow Block Diagram primarily present?","options":["A. Database table relationships","B. Time-sequenced functional activities","C. Hardware prices","D. Employee records"],"answers":["B. Time-sequenced functional activities"],"id":"fa4-5"},{"group":"FA 4","number":6,"prompt":"What is system architecture?","options":["A. A list of users who can access a system","B. A conceptual model of a system’s structure and behavior","C. A financial plan for system development","D. A collection of programming errors"],"answers":["B. A conceptual model of a system’s structure and behavior"],"id":"fa4-6"},{"group":"FA 4","number":7,"prompt":"What is the primary purpose of Business Process Modeling?","options":["A. To identify computer specifications","B. To represent, analyze, and improve organizational processes","C. To determine employee salaries","D. To install software applications"],"answers":["B. To represent, analyze, and improve organizational processes"],"id":"fa4-7"},{"group":"FA 4","number":8,"prompt":"Which type of business process creates the organization’s primary value stream?","options":["A. Management process","B. Supporting process","C. Operational process","D. Documentation process"],"answers":["C. Operational process"],"id":"fa4-8"},{"group":"FA 4","number":9,"prompt":"Which of the following is an example of a supporting process?","options":["A. Strategic management","B. Product manufacturing","C. Marketing and sales","D. Recruitment and technical support"],"answers":["D. Recruitment and technical support"],"id":"fa4-9"},{"group":"FA 4","number":10,"prompt":"What is the purpose of Business Process Model and Notation (BPMN)?","options":["A. To provide a graphical notation for business processes","B. To identify computer hardware","C. To calculate software costs","D. To create database record"],"answers":["A. To provide a graphical notation for business processes"],"id":"fa4-10"},{"group":"SA 1","number":1,"prompt":"Software engineering is a systematic, disciplined, and quantifiable approach to the development, operation, and maintenance of software. _______","options":["True","False"],"answers":["True"],"id":"sa1-1"},{"group":"SA 1","number":2,"prompt":"What is the foundation of software engineering as a layered technology?","options":["A. Tools","B. Methods","C. Process","D. Programming"],"answers":["C. Process"],"id":"sa1-2"},{"group":"SA 1","number":3,"prompt":"Which term refers to a temporary endeavor designed to produce a unique product or service?","options":["A. Process","B. Project","C. Program","D. Routine"],"answers":["B. Project"],"id":"sa1-3"},{"group":"SA 1","number":4,"prompt":"Who is associated with the development and use of the Gantt Chart?","options":["A. Henri Fayol","B. Henry Gantt","C. Robert Pressman","D. Ian Sommerville"],"answers":["B. Henry Gantt"],"id":"sa1-4"},{"group":"SA 1","number":5,"prompt":"What does PERT stand for?","options":["A. Project Execution and Resource Technique","B. Program/Project Evaluation and Review Technique","C. Project Evaluation and Reporting Tool","D. Planning, Execution, Review, and Testing"],"answers":["B. Program/Project Evaluation and Review Technique"],"id":"sa1-5"},{"group":"SA 1","number":6,"prompt":"The process layer serves as the foundation of software engineering as a layered technology. _______","options":["True","False"],"answers":["True"],"id":"sa1-6"},{"group":"SA 1","number":7,"prompt":"The formal acceptance and ending of a project takes place during the __________ phase.","options":[],"answers":["Closing","closing","CLOSING"],"id":"sa1-7"},{"group":"SA 1","number":8,"prompt":"A __________ is a temporary endeavor designed to produce a unique product or service.","options":[],"answers":["Project","project","PROJECT"],"id":"sa1-8"},{"group":"SA 1","number":9,"prompt":"The project deliverables have been accepted and all work is complete. The manager must decide what to do next. Which action best follows the project management process?","options":["A. Restart the analysis phase.","B. Formally close the project, settle applicable contracts, and archive documentation.","C. Add new requirements without approval.","D. Continue the project indefinitely."],"answers":["B. Formally close the project, settle applicable contracts, and archive documentation."],"id":"sa1-9"},{"group":"SA 1","number":10,"prompt":"Requirements analysis involves determining the conditions that need to be met. _______","options":["True","False"],"answers":["True"],"id":"sa1-10"},{"group":"SA 1","number":11,"prompt":"__________ is the procedure of breaking down an intellectual or substantial whole into parts.","options":[],"answers":["Analysis","analysis","ANALYSIS"],"id":"sa1-11"},{"group":"SA 1","number":12,"prompt":"Consider these two activities: Activity X separates a complex system into components to study how each part functions. Activity Y combines those components to develop an overall coherent picture. Which classification is correct?","options":["A. X = Synthesis; Y = Analysis","B. X = Analysis; Y = Synthesis","C. X = Planning; Y = Implementation","D. X = Implementation; Y = Closing"],"answers":["B. X = Analysis; Y = Synthesis"],"id":"sa1-12"},{"group":"SA 1","number":13,"prompt":"If a project team is allocating human resources, materials, and budget to produce planned deliverables, the team is in the implementation/execution phase. _______","options":["True","False"],"answers":["True"],"id":"sa1-13"},{"group":"SA 1","number":14,"prompt":"When analysts determine the conditions that a system must meet, they are performing __________ analysis.","options":[],"answers":["requirements","Requirements","requirements","REQUIREMENTS","Requirement","requirement","REQUIREMENT"],"id":"sa1-14"},{"group":"SA 1","number":15,"prompt":"A __________ Chart is used to schedule, organize, and coordinate tasks within a project and analyze the time needed to complete them.","options":[],"answers":["PERT"],"id":"sa1-15"},{"group":"SA 1","number":16,"prompt":"A proposed system satisfies its technical requirements but does not address the actual needs expressed by stakeholders. Which activity was most likely inadequate?","options":["A. Requirements gathering and analysis","B. Project closing","C. File archiving","D. Contract closure"],"answers":["A. Requirements gathering and analysis"],"id":"sa1-16"},{"group":"SA 1","number":17,"prompt":"During system development, the team interviews users and reviews their input to determine what the proposed system should do. Which phase are they performing?","options":["A. Closing","B. Analysis","C. Implementation","D. Maintenance"],"answers":["B. Analysis"],"id":"sa1-17"},{"group":"SA 1","number":18,"prompt":"A PERT Chart is used to schedule, organize, and coordinate tasks within a project. _______","options":["True","False"],"answers":["True"],"id":"sa1-18"},{"group":"SA 1","number":19,"prompt":"A development team has identified several user problems and is now trying to develop solutions that meet those needs. Which analysis procedure are they applying?","options":["A. Scope Definition","B. Problem Analysis","C. Logical Design","D. Decision Analysis"],"answers":["B. Problem Analysis"],"id":"sa1-19"},{"group":"SA 1","number":20,"prompt":"Henry __________ is known for his use of the chart that displays project activities over time.","options":[],"answers":["Gantt"],"id":"sa1-20"},{"group":"SA 2","number":1,"prompt":"Which Agile value emphasizes cooperation with clients instead of focusing primarily on formal agreements?","options":["B. Working software over comprehensive documentation","C. Customer collaboration over contract negotiation","A. Individuals and interactions over processes and tools","D. Responding to change over following a plan"],"answers":["C. Customer collaboration over contract negotiation"],"id":"sa2-1"},{"group":"SA 2","number":2,"prompt":"Which statement correctly describes Agile development?","options":["B. It delivers software through short, iterative increments.","A. It completes all testing after development.","D. It requires all designs to be completed before coding.","C. It prevents requirements from changing."],"answers":["B. It delivers software through short, iterative increments."],"id":"sa2-2"},{"group":"SA 2","number":3,"prompt":"What is the primary measure of progress according to Agile principles?","options":["A. Number of meetings conducted","C. Working software","D. Number of developers assigned","B. Amount of documentation produced"],"answers":["C. Working software"],"id":"sa2-3"},{"group":"SA 2","number":4,"prompt":"In Scrum, who prioritizes the product backlog based on stakeholder value?","options":["D. Systems Analyst","B. Product Owner","A. Scrum Master","C. Development Team"],"answers":["B. Product Owner"],"id":"sa2-4"},{"group":"SA 2","number":5,"prompt":"What is a sprint in Scrum?","options":["B. A time-boxed period in which selected work is completed","C. A document containing system requirements","D. A meeting used to assign permanent roles","A. A final evaluation conducted after deployment"],"answers":["B. A time-boxed period in which selected work is completed"],"id":"sa2-5"},{"group":"SA 2","number":6,"prompt":"Which Scrum role facilitates the process, enforces Scrum practices, and removes team impediments?","options":["A. Product Owner","D. Business Analyst","C. Scrum Master","B. Project Sponsor"],"answers":["C. Scrum Master"],"id":"sa2-6"},{"group":"SA 2","number":7,"prompt":"Which Agile methodology focuses primarily on people and their interactions rather than processes and tools?","options":["A. Crystal","B. Waterfall","D. Lean Software Development","C. Feature-Driven Development"],"answers":["A. Crystal"],"id":"sa2-7"},{"group":"SA 2","number":8,"prompt":"In DSDM, what does the letter M represent in the MoSCoW prioritization technique?","options":["A. Manage","B. Measure","D. Modify","C. Must have"],"answers":["C. Must have"],"id":"sa2-8"},{"group":"SA 2","number":9,"prompt":"Which Lean Software Development principle involves removing activities that do not add value?","options":["C. Build integrity","B. Eliminate waste","D. Amplify learning","A. Defer commitment"],"answers":["B. Eliminate waste"],"id":"sa2-9"},{"group":"SA 2","number":10,"prompt":"Extreme Programming is particularly suitable when:","options":["C. Users cannot participate in development.","A. Requirements are fixed and cannot change.","B. Customer requirements change frequent","D. Software is delivered only once."],"answers":["B. Customer requirements change frequent"],"id":"sa2-10"},{"group":"SA 2","number":11,"prompt":"Which type of modeling represents the activities, functions, processes, and operations within a system?","options":["B. Financial modeling","C. Physical modeling","A. Functional modeling","D. Statistical modeling"],"answers":["A. Functional modeling"],"id":"sa2-11"},{"group":"SA 2","number":12,"prompt":"In a Data Flow Diagram, which symbol represents the movement of data between components?","options":["C. Circle","B. Arrow","A. Rectangle","D. Open-ended rectangle"],"answers":["B. Arrow"],"id":"sa2-12"},{"group":"SA 2","number":13,"prompt":"Which business process creates the organization’s primary value through activities such as purchasing, manufacturing, marketing, and sales?","options":["D. Development process","A. Management process","C. Operational process","B. Supporting process"],"answers":["C. Operational process"],"id":"sa2-13"},{"group":"SA 2","number":14,"prompt":"Which fact-finding technique is most appropriate for collecting information from a large number of respondents?","options":["A. Interview","B. Observation","D. Record inspection","C. Questionnaire"],"answers":["C. Questionnaire"],"id":"sa2-14"},{"group":"SA 2","number":15,"prompt":"Which type of questionnaire allows respondents to answer using their own words?","options":["Closed-ended questionnaire","Open-ended questionnaire","Multiple-choice questionnaire","Structured checklist"],"answers":["Open-ended questionnaire"],"id":"sa2-15"},{"group":"SA 2","number":16,"prompt":"Interviews, questionnaires, observations, record reviews, and research are fact-finding techniques used in requirements analysis.","options":["False","True"],"answers":["True"],"id":"sa2-16"},{"group":"SA 2","number":17,"prompt":"Minimum and recommended system requirements always provide exactly the same level of system performance.","options":["False","True"],"answers":["False"],"id":"sa2-17"},{"group":"SA 2","number":18,"prompt":"In a Data Flow Diagram, an external entity may provide input to or receive output from a process.","options":["False","True"],"answers":["True"],"id":"sa2-18"},{"group":"SA 2","number":19,"prompt":"Business Process Modeling can help organizations analyze, improve, and automate their existing processes.","options":["False","True"],"answers":["True"],"id":"sa2-19"},{"group":"SA 2","number":20,"prompt":"The Waterfall model allows customers to review and modify the product after every short iteration.","options":["True","False"],"answers":["False"],"id":"sa2-20"},{"group":"Midterms","number":1,"prompt":"Which statement best defines software?","options":["A. A physical component that stores data","B. A collection of programs, procedures, data structures, and documentation","C. A network connection used only for communication","D. A project schedule used to track development"],"answers":["B. A collection of programs, procedures, data structures, and documentation"],"id":"midterms-1"},{"group":"Midterms","number":2,"prompt":"Which software category consists of stand-alone programs that solve specific business needs?","options":["A. System software","B. Application software","C. Embedded software","D. Engineering software"],"answers":["B. Application software"],"id":"midterms-2"},{"group":"Midterms","number":3,"prompt":"Which framework activity involves creating a sketch of the project to understand the big picture?","options":["A. Planning","B. Modeling","C. Construction","D. Deployment"],"answers":["B. Modeling"],"id":"midterms-3"},{"group":"Midterms","number":4,"prompt":"Which type of system produces results that cannot be predicted with certainty?","options":["A. Closed system","B. Open or probabilistic system","C. Transaction processing system","D. Expert system"],"answers":["B. Open or probabilistic system"],"id":"midterms-4"},{"group":"Midterms","number":5,"prompt":"Which information-system activity transforms raw data into a useful form?","options":["A. Input","B. Process","C. Output","D. Feedback"],"answers":["B. Process"],"id":"midterms-5"},{"group":"Midterms","number":6,"prompt":"Which information system handles routine transactions such as payroll and sales-order entry?","options":["A. DSS","B. EIS","C. TPS","D. Expert system"],"answers":["C. TPS"],"id":"midterms-6"},{"group":"Midterms","number":7,"prompt":"Which information system commonly uses internal and external data to assist decision-makers with non-routine problems?","options":["A. Decision Support System","B. Workflow System","C. Transaction Processing System","D. System Software"],"answers":["A. Decision Support System"],"id":"midterms-7"},{"group":"Midterms","number":8,"prompt":"Which SDLC phase first determines whether a new system is needed and examines feasibility?","options":["A. Planning","B. System Design","C. System Testing","D. System Maintenance"],"answers":["A. Planning"],"id":"midterms-8"},{"group":"Midterms","number":9,"prompt":"During which SDLC phase are functional requirements and stakeholder needs primarily gathered and studied?","options":["A. System Analysis","B. System Development","C. System Implementation","D. System Maintenance"],"answers":["A. System Analysis"],"id":"midterms-9"},{"group":"Midterms","number":10,"prompt":"Verification and validation are emphasized in which SDLC phase?","options":["A. Planning","B. System Design","C. System Testing","D. System Implementation"],"answers":["C. System Testing"],"id":"midterms-10"},{"group":"Midterms","number":11,"prompt":"Which statement best describes a project?","options":["A. A permanent set of routine operational activities","B. A temporary endeavor that creates a unique product or service","C. Any task without a defined goal","D. An activity that has no constraints"],"answers":["B. A temporary endeavor that creates a unique product or service"],"id":"midterms-11"},{"group":"Midterms","number":12,"prompt":"Which chart displays project tasks against time using horizontal bars?","options":["A. PERT chart","B. Gantt chart","C. Data flow diagram","D. Use-case diagram"],"answers":["B. Gantt chart"],"id":"midterms-12"},{"group":"Midterms","number":13,"prompt":"Which project-management tool focuses on task dependencies and the minimum time needed to complete a project?","options":["A. Gantt chart","B. PERT chart","C. Decision tree","D. BPMN diagram"],"answers":["B. PERT chart"],"id":"midterms-13"},{"group":"Midterms","number":14,"prompt":"In the Four Ps approach, which P refers to authority, decision-makers, organizational charts, and policies?","options":["A. Plan","B. Process","C. People","D. Power"],"answers":["D. Power"],"id":"midterms-14"},{"group":"Midterms","number":15,"prompt":"Which project-management phase regularly measures performance, identifies variances, and enables corrective action?","options":["A. Initiation","B. Execution","C. Monitoring and Controlling","D. Closing"],"answers":["C. Monitoring and Controlling"],"id":"midterms-15"},{"group":"Midterms","number":16,"prompt":"Which systems-analysis step determines the conditions or capabilities the proposed system must satisfy?","options":["A. Scope definition","B. Problem analysis","C. Requirements analysis","D. Decision analysis"],"answers":["C. Requirements analysis"],"id":"midterms-16"},{"group":"Midterms","number":17,"prompt":"Which Agile value gives greater emphasis to a usable product than to extensive documentation?","options":["A. Processes and tools over individuals","B. Working software over comprehensive documentation","C. Contract negotiation over collaboration","D. Following a plan over responding to change"],"answers":["B. Working software over comprehensive documentation"],"id":"midterms-17"},{"group":"Midterms","number":18,"prompt":"Who prioritizes the product backlog and represents stakeholder interests in Scrum?","options":["A. Scrum Master","B. Product Owner","C. Project Sponsor","D. Development Tester"],"answers":["B. Product Owner"],"id":"midterms-18"},{"group":"Midterms","number":19,"prompt":"Which Scrum event is limited to 15 minutes and occurs at the same time and place each day?","options":["A. Sprint Review","B. Sprint Retrospective","C. Daily Scrum","D. Backlog Refinement"],"answers":["C. Daily Scrum"],"id":"midterms-19"},{"group":"Midterms","number":20,"prompt":"Which DSDM technique classifies requirements as Must have, Should have, Could have, and Won't have?","options":["A. Timeboxing","B. MoSCoW","C. Prototyping","D. Cyclic Delivery"],"answers":["B. MoSCoW"],"id":"midterms-20"},{"group":"Midterms","number":21,"prompt":"Which Agile method focuses on designing and building features through specific, short phases?","options":["A. Crystal","B. Feature Driven Development","C. Lean Software Development","D. Extreme Programming"],"answers":["B. Feature Driven Development"],"id":"midterms-21"},{"group":"Midterms","number":22,"prompt":"In a data flow diagram, which symbol represents the movement of data between elements?","options":["A. Open rectangle","B. Arrow or flow line","C. Rounded rectangle","D. External-entity box"],"answers":["B. Arrow or flow line"],"id":"midterms-22"},{"group":"Midterms","number":23,"prompt":"What does a data store represent in a DFD?","options":["A. A source outside the system","B. A transformation of input into output","C. A location where information is stored temporarily or permanently","D. A decision made by management"],"answers":["C. A location where information is stored temporarily or permanently"],"id":"midterms-23"},{"group":"Midterms","number":24,"prompt":"Which business process creates the primary value stream through activities such as purchasing, manufacturing, marketing, and sales?","options":["A. Management process","B. Operational process","C. Supporting process","D. Enterprise process"],"answers":["B. Operational process"],"id":"midterms-24"},{"group":"Midterms","number":25,"prompt":"Which fact-finding technique is most suitable for collecting standardized responses from a large group?","options":["A. Interview","B. Observation","C. Questionnaire","D. Record inspection"],"answers":["C. Questionnaire"],"id":"midterms-25"},{"group":"Midterms","number":26,"prompt":"Legacy software is often continually modified to meet changing business needs and may be costly to maintain.","options":["True","False"],"answers":["True"],"id":"midterms-26"},{"group":"Midterms","number":27,"prompt":"A closed system produces outputs that can only be guessed and cannot be predicted with certainty.","options":["True","False"],"answers":["False"],"id":"midterms-27"},{"group":"Midterms","number":28,"prompt":"In an information system, feedback refers to evaluating the output or results.","options":["True","False"],"answers":["True"],"id":"midterms-28"},{"group":"Midterms","number":29,"prompt":"SDLC documentation is usually performed only after the system has been implemented.","options":["True","False"],"answers":["False"],"id":"midterms-29"},{"group":"Midterms","number":30,"prompt":"System maintenance may require developers to revisit earlier SDLC phases when updates are needed.","options":["True","False"],"answers":["True"],"id":"midterms-30"},{"group":"Midterms","number":31,"prompt":"Routine, repetitive operational work is always considered a project.","options":["True","False"],"answers":["False"],"id":"midterms-31"},{"group":"Midterms","number":32,"prompt":"Project closing includes formal acceptance, archiving documents, and settling applicable contracts.","options":["True","False"],"answers":["True"],"id":"midterms-32"},{"group":"Midterms","number":33,"prompt":"Analysis combines separate elements to form a coherent whole, while synthesis breaks a whole into parts.","options":["True","False"],"answers":["False"],"id":"midterms-33"},{"group":"Midterms","number":34,"prompt":"Agile welcomes changing requirements, even late in development.","options":["True","False"],"answers":["True"],"id":"midterms-34"},{"group":"Midterms","number":35,"prompt":"In Scrum, incomplete work may be demonstrated during the Sprint Review.","options":["True","False"],"answers":["False"],"id":"midterms-35"},{"group":"Midterms","number":36,"prompt":"Crystal emphasizes people and their interactions more than processes and tools.","options":["True","False"],"answers":["True"],"id":"midterms-36"},{"group":"Midterms","number":37,"prompt":"In DSDM timeboxing, time and budget are fixed while lower-priority requirements may be omitted.","options":["True","False"],"answers":["True"],"id":"midterms-37"},{"group":"Midterms","number":38,"prompt":"Lean Software Development treats unnecessary features and abandoned partially completed code as waste.","options":["True","False"],"answers":["True"],"id":"midterms-38"},{"group":"Midterms","number":39,"prompt":"A DFD should mix several levels of detail on one chart to minimize the number of diagrams.","options":["True","False"],"answers":["False"],"id":"midterms-39"},{"group":"Midterms","number":40,"prompt":"Open-ended questionnaires generally produce qualitative responses written in the respondents' own words.","options":["True","False"],"answers":["True"],"id":"midterms-40"},{"group":"Midterms","number":41,"prompt":"The seven-phase process used to plan, create, test, deploy, and maintain an information system. (Abbreviation is not allowed)","options":[],"answers":["Systems Development Life Cycle","systems development life cycle","SYSTEMS DEVELPOMENT LIFE CYCLE"],"id":"midterms-41"},{"group":"Midterms","number":42,"prompt":"A system that provides routine information to managers and supports areas such as marketing, production, and finance. (Abbreviation is not allowed)","options":[],"answers":["Management Information System","management information system","MANAGEMENT INFORMATION SYSTEM"],"id":"midterms-42"},{"group":"Midterms","number":43,"prompt":"A temporary endeavor undertaken to create a unique product or service.","options":[],"answers":["Project","project","PROJECT"],"id":"midterms-43"},{"group":"Midterms","number":44,"prompt":"The procedure of breaking an intellectual or substantial whole into parts for study.","options":[],"answers":["Analysis","analysis","ANALYSIS"],"id":"midterms-44"},{"group":"Midterms","number":45,"prompt":"The Scrum facilitator who enforces Scrum rules, removes impediments, and coaches the team.","options":[],"answers":["Scrum Master","scrum master","SCRUM MASTER"],"id":"midterms-45"},{"group":"Midterms","number":46,"prompt":"A fixed-length Scrum development period, commonly lasting two weeks.","options":[],"answers":["Sprint","sprint","SPRINT"],"id":"midterms-46"},{"group":"Midterms","number":47,"prompt":"The Agile approach developed by Alistair Cockburn that emphasizes people and communication.","options":[],"answers":["Crystal Method","crystal method","CRYSTAL METHOD"],"id":"midterms-47"},{"group":"Midterms","number":48,"prompt":"A graphical notation used to specify business processes in a Business Process Diagram. (Abbreviation is not allowed)","options":[],"answers":["Business Process Model and Notation","business process model and notation","BUSINESS PROCESS MODEL AND NOTATIONS"],"id":"midterms-48"},{"group":"Midterms","number":49,"prompt":"A graphical illustration showing the flow of data and logic within a system (Abbreviation is not allowed)","options":[],"answers":["Data Flow Diagram","data flow diagram","DATA FLOW DIAGRAM"],"id":"midterms-49"},{"group":"Midterms","number":50,"prompt":"An advanced fact-finding technique that obtains information from published materials or documents to verify facts.","options":[],"answers":["Research","research","RESEARCH"],"id":"midterms-50"}]</script><script>
const bank=JSON.parse(document.getElementById('data').textContent);const section=document.getElementById('section');const list=document.getElementById('questions');const progress=new Map();let order=bank.map(x=>x.id);
const matches=q=>section.value==='all-fa'?q.group.startsWith('FA '):section.value==='all-sa'?q.group.startsWith('SA '):q.group===section.value;
const normalize=s=>s.normalize('NFKC').trim().toLocaleLowerCase().replace(/\s+/g,' ');
function stats(){const visible=bank.filter(matches);const records=visible.map(q=>progress.get(q.id)).filter(Boolean);document.getElementById('total').textContent=visible.length;document.getElementById('answered').textContent=records.length;document.getElementById('correct').textContent=records.filter(r=>r.ok).length;document.getElementById('score').textContent=(records.length?Math.round(records.filter(r=>r.ok).length/records.length*100):0)+'%'}
function text(tag,value,className){const el=document.createElement(tag);el.textContent=value;if(className)el.className=className;return el}
function feedback(card,q,record){const msg=record.ok?'Correct!':'Incorrect. Correct answer: '+q.answers[0];card.append(text('p',msg,'feedback '+(record.ok?'good':'bad')))}
function render(){list.replaceChildren();const lookup=new Map(bank.map(q=>[q.id,q]));for(const id of order){const q=lookup.get(id);if(!q||!matches(q))continue;const record=progress.get(id);const card=text('article','','card');card.append(text('div','QUESTION '+q.number+' · '+q.group,'meta'),text('h2',q.prompt));if(q.options.length){const choices=text('div','','choices');for(const option of q.options){const button=text('button',option,'choice');button.type='button';if(record){button.disabled=true;if(option===q.answers[0])button.classList.add('is-right');else if(option===record.value)button.classList.add('is-wrong')}else button.addEventListener('click',()=>{progress.set(id,{value:option,ok:q.answers.includes(option)});render()});choices.append(button)}card.append(choices)}else{const form=text('form','','fill');const input=text('input','','answer-input');input.type='text';input.placeholder='Type your answer';input.setAttribute('aria-label','Answer for question '+q.number);input.autocomplete='off';input.required=true;const submit=text('button','Submit answer','submit');submit.type='submit';if(record){input.value=record.value;input.disabled=true;submit.disabled=true}form.append(input,submit);form.addEventListener('submit',event=>{event.preventDefault();const value=input.value.trim();if(!value)return;progress.set(id,{value,ok:q.answers.some(a=>normalize(a)===normalize(value))});render()});card.append(form);if(!record)card.append(text('div','Capitalization and extra spaces are ignored; accepted wording follows the source file.','hint'))}if(record)feedback(card,q,record);list.append(card)}stats()}
section.addEventListener('change',render);document.getElementById('shuffle').addEventListener('click',()=>{const selected=order.filter(id=>{const q=bank.find(x=>x.id===id);return q&&matches(q)});for(let i=selected.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[selected[i],selected[j]]=[selected[j],selected[i]]}let pos=0;order=order.map(id=>{const q=bank.find(x=>x.id===id);return q&&matches(q)?selected[pos++]:id});render()});document.getElementById('reset').addEventListener('click',()=>{for(const q of bank.filter(matches))progress.delete(q.id);render()});render();
</script></body></html>
